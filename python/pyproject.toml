[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connx-rms-showcase"
version = "1.0.0"
description = "CONNX access to OpenVMS RMS CUSTOMER data"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "pyodbc>=5.0,<6.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "httpx2>=2.0", "pytest>=8.0", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["connx_rms_showcase"]
